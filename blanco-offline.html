<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blanco Multi_services — Sistèm Vant</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#14213d;--mut:#667085;--line:#dde2ec;--pri:#14305c;--onpri:#fff;--acc:#f2b705;--ok:#13795b;--bad:#c0392b;--warn:#b26a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#eef1f7;--mut:#9aa6bd;--line:#2a3652;--pri:#f2b705;--onpri:#14213d;--acc:#f2b705;--ok:#4cd0a2;--bad:#ff7b6b;--warn:#ffb84d}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#eef1f7;--mut:#9aa6bd;--line:#2a3652;--pri:#f2b705;--onpri:#14213d;--acc:#f2b705;--ok:#4cd0a2;--bad:#ff7b6b;--warn:#ffb84d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
header{background:var(--pri);color:var(--onpri);padding:14px 16px;display:flex;align-items:center;gap:10px}header img{height:42px;width:42px;object-fit:contain;background:#fff;border-radius:8px}
header b{font-size:20px;font-weight:800;letter-spacing:.2px}header span{display:block;font-size:13px;opacity:.8}
main{max-width:720px;margin:0 auto;padding:12px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;background:var(--card);border-bottom:1px solid var(--line);padding:6px}
nav{flex-wrap:wrap;gap:4px}nav button{flex:1 0 22%;border:0;background:none;color:var(--mut);font:600 13px Figtree,system-ui,sans-serif;white-space:nowrap;padding:9px 4px;border-radius:10px}
nav button.on{background:var(--pri);color:var(--onpri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:18px;margin:4px 0 10px}h3{font-size:15px;margin:0 0 8px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:2px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fit{flex:0 0 auto}
.btn{border:0;border-radius:10px;padding:11px 14px;font:700 15px Figtree,system-ui,sans-serif;background:var(--pri);color:var(--onpri);width:100%}
.btn.sm{width:auto;padding:7px 11px;font-size:13px}.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.bad{background:var(--bad);color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item small{color:var(--mut);display:block}
.prod{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.prod:disabled{opacity:.4}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.low{color:var(--warn)}.out{color:var(--bad)}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:10px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stat small{color:var(--mut)}.stat b{display:block;font-size:20px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px}
.empty{color:var(--mut);text-align:center;padding:18px 0}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;overflow:auto;padding:16px}
#rc{background:#fff;color:#000;max-width:300px;margin:0 auto 12px;padding:14px;font:13px/1.35 'Courier New',monospace}
#rc h4{text-align:center;margin:0 0 4px;font-size:1.2em}#rc .c{text-align:center}#rc hr{border:0;border-top:1px dashed #000;margin:6px 0}
#rc .l{display:flex;justify-content:space-between;gap:6px}
.acts{max-width:300px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
@media print{body>*:not(#ov){display:none!important}#ov{display:block!important;position:static;background:none;padding:0}.acts{display:none}#rc{margin:0;max-width:100%}}
</style>
</head>
<body>
<header id="hd"></header>
<div id="sync" style="display:none;padding:6px 12px;font-size:13px;font-weight:700;background:#b26a00;color:#fff;text-align:center"></div>
<nav id="nav"></nav>
<main id="app"></main>
<div id="ov"><div id="rc"></div><div class="acts"><button class="btn" style="background:#25d366;color:#0b3d1d" onclick="waOpen()">Voye sou WhatsApp</button><button class="btn" onclick="btPrint()">Imprimer (Bluetooth)</button><div id="bts" style="color:#fff;text-align:center;font-size:13px"></div><button class="btn alt" onclick="saveRc()">Sove reçu a (imaj)</button><button class="btn alt" onclick="btSettings()">Paramèt Bluetooth telefòn lan</button><button class="btn alt" onclick="closeRc()">Fèmen</button></div></div>
<script>
const K='blanco_pos_v1';let db={products:[],sales:[],seq:1};
try{const s=localStorage.getItem(K);if(s)db=JSON.parse(s)}catch(e){}
db.cfg=Object.assign({name:'Blanco Multi_services',phone:'',address:'',footer:'Mèsi, tounen vini ankò!',logo:'',pin:'',paper:32},db.cfg||{});
db.staff=db.staff||[];db.clients=db.clients||{};
if(!db.cfg.lang){db.cfg.lang='fr';if(db.cfg.footer==='Mèsi, tounen vini ankò!')db.cfg.footer='Merci, revenez nous voir !';try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
let ch=0;db.staff.forEach(x=>{if(!x.code){let c;do{c=String(1000+Math.floor(Math.random()*9000))}while(c===db.cfg.pin||db.staff.some(y=>y.code===c));x.code=c;ch=1}});if(ch)try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(+n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' HTG';
const dt=t=>new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
let tab='vant',cart={},q='',editId=null,client='',pay='Kach',per='day',delId=null,seller='',voidId=null,user=null,rs='',cphone='',hq='',hd='',hlim=30,waNo=null,wq='',wph='';
const TABS=[['vant','Vant'],['cli','Kliyan'],['pwodwi','Pwodwi'],['inv','Inventè'],['rap','Rapò'],['ist','Istorik'],['wa','WhatsApp'],['admin','Admin']];
function go(t){tab=t;delId=null;msg='';voidId=null;sdId=null;seId=null;if(t!=='admin')unlocked=false;render()}
function render(){
 const need=db.staff.length&&!user;if(need){hdr();$('nav').innerHTML='';$('app').style.zoom=1;$('app').innerHTML=vLogin();return}
 const T=user&&user!=='owner'?TABS.filter(t=>t[0]==='vant'||t[0]==='ist'||t[0]==='wa'):TABS;if(!T.some(t=>t[0]===tab))tab='vant';
 $('nav').innerHTML=T.map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
 hdr();$('app').style.zoom=[.9,1,1.15,1.3][db.cfg.uiSize??1];$('app').innerHTML={vant:vVant,pwodwi:vProd,inv:vInv,rap:vRap,ist:vHist,wa:vWa,cli:vCli,admin:vAdmin}[tab]();
}
const stTag=p=>p.qty<=0?'<span class="tag out">Fini</span>':p.qty<=(p.min??5)?`<span class="tag low">Ba · ${p.qty}</span>`:`<span class="tag ok">${p.qty}</span>`;
/* VANT */
function vVant(){
 const list=db.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
 const ids=Object.keys(cart);let tot=0;
 const lines=ids.map(id=>{const p=db.products.find(x=>x.id==id);if(!p)return'';tot+=p.price*cart[id];
  return `<div class="item"><div>${esc(p.name)}<small id="sl${id}">${money(p.price)} × ${cart[id]} = ${money(p.price*cart[id])}</small></div><div class="qty"><button onclick="chg(${id},-1)">−</button><input type="number" inputmode="numeric" min="1" max="${p.qty}" value="${cart[id]}" onfocus="this.select()" oninput="qtyInput(${id},this)" onchange="qtyDone(${id},this)" style="width:72px;text-align:center;margin:0;padding:7px"><button onclick="chg(${id},1)">+</button></div></div>`}).join('');
 return `<div class="card"><h2>Nouvo vant</h2><input id="q" placeholder="Chèche yon pwodwi…" value="${esc(q)}" oninput="q=this.value;keep()">
 <div id="pl">${plist(list)}</div></div>
 <div class="card"><h3>Panye</h3>${lines||'<div class="empty">Panye a vid. Tape sou yon pwodwi pou ajoute l.</div>'}
 <div class="total"><span>Total</span><span id="ct">${money(tot)}</span></div>
 <label>Non kliyan (opsyonèl)</label><input id="cn" list="cl-n" autocomplete="off" value="${esc(client)}" oninput="client=this.value;cliHint()" onchange="cliPick(this.value)">
 <label>Nimewo WhatsApp kliyan (opsyonèl)</label><input id="cp" list="cl-p" type="tel" inputmode="tel" placeholder="509 …" value="${esc(cphone)}" oninput="cphone=this.value;cliHint()" onchange="cliPick(this.value)"><datalist id="cl-n">${clOpts('n')}</datalist><datalist id="cl-p">${clOpts('p')}</datalist><div id="cih" style="font-size:13px;color:var(--mut);margin:-2px 0 8px">${cliHintText()}</div>
 ${user&&user!=='owner'?`<p style="margin:0 0 8px;color:var(--mut)">Vandè: <b style="color:var(--ink)">${esc(user.name)}</b></p>`:''}${db.staff.length&&user==='owner'?`<label>Vandè</label><select onchange="seller=this.value"><option value="">—</option>${db.staff.map(x=>`<option ${x.name===seller?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}<label>Peman</label><select onchange="pay=this.value;render()">${['Kach','MonCash','Natcash','Kredi'].map(x=>`<option value="${x}" ${x===pay?'selected':''}>${x}</option>`).join('')}</select>
 ${calcHtml(ids.length)}<button class="btn" onclick="sell()" ${ids.length?'':'disabled style="opacity:.5"'}>Konfime vant</button></div>`}
const plist=l=>l.length?l.map(p=>`<button class="prod" ${p.qty<=0?'disabled':''} onclick="add(${p.id})"><span>${esc(p.name)}<small style="display:block;color:var(--mut)">${money(p.price)}</small></span>${stTag(p)}</button>`).join(''):'<div class="empty">Pa gen pwodwi. Ale nan "Pwodwi" pou ajoute yo.</div>';
function keep(){$('pl').innerHTML=plist(db.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())))}
function add(id){const p=db.products.find(x=>x.id==id);if((cart[id]||0)<p.qty)cart[id]=(cart[id]||0)+1;else alert('Pa gen plis stòk pou '+p.name);render()}
function qtyInput(id,el){
 const p=db.products.find(x=>x.id==id);if(!p)return;
 let n=parseInt(el.value);if(isNaN(n)||n<1)return;
 if(n>p.qty){n=p.qty;el.value=n;alert('Pa gen plis stòk pou '+p.name)}
 cart[id]=n;updCart(id,p)}
function qtyDone(id,el){const n=parseInt(el.value);if(isNaN(n)||n<1){delete cart[id];render()}else el.value=cart[id]}
function updCart(id,p){
 const s=document.getElementById('sl'+id);if(s)s.textContent=money(p.price)+' × '+cart[id]+' = '+money(p.price*cart[id]);
 let t=0;Object.keys(cart).forEach(k=>{const q=db.products.find(x=>x.id==k);if(q)t+=q.price*cart[k]});
 const e=document.getElementById('ct');if(e)e.textContent=money(t);const gc=document.getElementById('gc');if(gc)gc.innerHTML=changeHtml(t)}
let given='';
const curTot=()=>{let t=0;Object.keys(cart).forEach(k=>{const q=db.products.find(x=>x.id==k);if(q)t+=q.price*cart[k]});return t};
function changeHtml(tt){const g=parseFloat(given);if(given===''||isNaN(g))return pay==='Kredi'?'<span style="color:var(--bad)">Rete pou peye: '+money(tt)+'</span>':'';const d=g-tt;return d>=0?'<span class="ok">Balans pou remèt: '+money(d)+'</span>':'<span style="color:var(--bad)">Rete pou peye: '+money(-d)+'</span>'}
function setGiven(v,btn){given=String(v);if(btn){const e=document.getElementById('gv');if(e)e.value=given}const c=document.getElementById('gc');if(c)c.innerHTML=changeHtml(curTot())}
function calcHtml(n){return (pay==='Kach'||pay==='Kredi')&&n?`<div style="margin:8px 0 10px;padding:10px;border:1px dashed var(--line);border-radius:10px"><label style="margin-top:0">Kliyan bay (HTG)</label><input id="gv" type="number" inputmode="decimal" min="0" value="${esc(given)}" oninput="setGiven(this.value)" placeholder="0"><div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:6px">${[50,100,250,500,1000].map(v=>`<button class="btn sm alt" style="flex:0 0 auto" onclick="setGiven(${v},1)">${v}</button>`).join('')}<button class="btn sm alt" style="flex:0 0 auto" onclick="setGiven(curTot(),1)">Egzak</button></div><div id="gc" style="font-weight:800;font-size:18px">${changeHtml(curTot())}</div></div>`:''}
function chg(id,d){const p=db.products.find(x=>x.id==id);const n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(n<=p.qty)cart[id]=n;render()}
function sell(){
 const items=Object.keys(cart).map(id=>{const p=db.products.find(x=>x.id==id);return{id:p.id,name:p.name,price:p.price,cost:p.cost||0,qty:cart[id]}});
 if(!items.length)return;
 {const t0=items.reduce((a,i)=>a+i.price*i.qty,0),g0=parseFloat(given)||0;if((pay==='Kredi'||(pay==='Kach'&&g0>0&&g0<t0))&&!(client.trim()||digits(cphone))){alert('Mete non oswa telefòn kliyan an pou balans lan.');return}}
 items.forEach(i=>{db.products.find(p=>p.id==i.id).qty-=i.qty});
 const s={no:db.seq++,t:Date.now(),client:client.trim(),phone:cphone.trim(),seller:(user&&user!=='owner')?user.name:seller,pay,items,total:items.reduce((a,i)=>a+i.price*i.qty,0)};
 const g=parseFloat(given)||0;
 if(pay==='Kredi'){s.paid=Math.min(g,s.total);s.due=s.total-s.paid}
 else if(pay==='Kach'&&g>0){if(g>=s.total){s.paid=g;s.change=g-s.total}else{s.paid=g;s.due=s.total-g}}
 {const ck=cliKey(client,cphone);if(ck){s.ckey=ck;const c=db.clients[ck]||(db.clients[ck]={key:ck,n:0,spent:0,last:0});if(client.trim())c.name=client.trim();if(digits(cphone))c.phone=cphone.trim();c.n++;c.spent+=s.total;c.last=Date.now();c.due=(c.due||0)+(s.due||0)}}
 db.sales.push(s);save();sheetPush(sheetEv(s));cart={};client='';cphone='';given='';render();showRc(s)}
/* PWODWI */
function vProd(){
 const e=db.products.find(p=>p.id===editId)||{};
 const rows=db.products.map(p=>`<div class="item"><div>${esc(p.name)}<small>Vant ${money(p.price)}${p.cost?' · Acha '+money(p.cost):''} · Stòk ${p.qty}</small></div><div class="row fit"><button class="btn sm alt" onclick="edit(${p.id})">Modifye</button>${delId===p.id?`<button class="btn sm bad" onclick="del(${p.id})">Konfime?</button>`:`<button class="btn sm alt" onclick="delId=${p.id};render()">Efase</button>`}</div></div>`).join('');
 return `<div class="card"><h2>${editId?'Modifye pwodwi':'Ajoute pwodwi'}</h2>
 <label>Non pwodwi</label><input id="pn" value="${esc(e.name||'')}">
 <div class="row"><div><label>Pri vant (HTG)</label><input id="pp" type="number" inputmode="decimal" min="0" value="${e.price??''}"></div><div><label>Pri acha (opsyonèl)</label><input id="pc" type="number" inputmode="decimal" min="0" value="${e.cost||''}"></div></div>
 <div class="row"><div><label>Kantite disponib</label><input id="pq" type="number" inputmode="numeric" min="0" value="${e.qty??''}"></div><div><label>Alèt stòk ba (≤)</label><input id="pm" type="number" inputmode="numeric" min="0" value="${e.min??5}"></div></div>
 <div class="row"><button class="btn" onclick="saveP()">${editId?'Anrejistre chanjman':'Ajoute'}</button>${editId?'<button class="btn alt fit" onclick="editId=null;render()">Anile</button>':''}</div></div>
 <div class="card"><h3>Lis pwodwi (${db.products.length})</h3>${rows||'<div class="empty">Pa gen pwodwi ankò.</div>'}</div>`}
function edit(id){editId=id;render();scrollTo(0,0)}
function del(id){db.products=db.products.filter(p=>p.id!==id);delete cart[id];delId=null;save();render()}
function saveP(){
 const name=$('pn').value.trim(),price=parseFloat($('pp').value),qty=parseInt($('pq').value);
 if(!name||isNaN(price)||isNaN(qty)){alert('Ranpli non, pri vant ak kantite.');return}
 const o={name,price,cost:parseFloat($('pc').value)||0,qty,min:parseInt($('pm').value)||0};
 if(editId){Object.assign(db.products.find(p=>p.id===editId),o)}else{db.products.push({id:Date.now(),...o})}
 editId=null;save();render()}
/* INVENTE */
function vInv(){
 const val=db.products.reduce((a,p)=>a+p.qty*p.price,0),low=db.products.filter(p=>p.qty<=(p.min??5)).length;
 const rows=db.products.map(p=>`<div class="item"><div>${esc(p.name)}<small>${money(p.price)} · Valè stòk ${money(p.qty*p.price)}</small></div><div class="row fit">${stTag(p)}<input id="r${p.id}" type="number" inputmode="numeric" min="1" placeholder="+" style="width:64px;margin:0"><button class="btn sm" onclick="restock(${p.id})">Ajoute</button></div></div>`).join('');
 return `<div class="stats"><div class="stat"><small>Valè total stòk</small><b>${money(val)}</b></div><div class="stat"><small>Pwodwi ki ba / fini</small><b>${low}</b></div></div>
 <div class="card"><h2>Inventè (${db.products.length} pwodwi)</h2>${rows||'<div class="empty">Pa gen pwodwi ankò.</div>'}</div>`}
function restock(id){const n=parseInt($('r'+id).value);if(!n||n<1)return;db.products.find(p=>p.id===id).qty+=n;save();render()}
/* RAPO */
function vRap(){
 const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
 const from={day:d0,week:d0-6*864e5,month:new Date(now.getFullYear(),now.getMonth(),1).getTime(),all:0}[per];
 const SA=db.sales.filter(s=>s.t>=from&&(!rs||s.seller===rs)).sort((a,b)=>b.t-a.t),S=SA.filter(s=>!s.void);
 const tot=S.reduce((a,s)=>a+s.total,0),n=S.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty,0),0);
 const prof=S.reduce((a,s)=>a+s.items.reduce((x,i)=>x+(i.price-i.cost)*i.qty,0),0);
 const top={};S.forEach(s=>s.items.forEach(i=>{top[i.name]=(top[i.name]||0)+i.qty}));
 const bs={};S.forEach(s=>{if(s.seller)bs[s.seller]=(bs[s.seller]||0)+s.total});const bl=Object.entries(bs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('');
 const tl=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`<div class="item"><span>${esc(k)}</span><b>${v}</b></div>`).join('');
 const sl=SA.map(s=>`<div class="item" style="${s.void?'opacity:.55':''}"><div>Reçu #${s.no}${s.void?' <span class="tag out">Anile</span>':''}${s.client?' · '+esc(s.client):''}<small>${dt(s.t)} · ${s.pay}${s.seller?' · '+esc(s.seller):''}${s.void&&s.void.why?' · '+esc(s.void.why):''}</small></div><div class="row fit"><b style="${s.void?'text-decoration:line-through':''}">${money(s.total)}</b><button class="btn sm alt" onclick="showRc(db.sales.find(x=>x.no===${s.no}))">Reçu</button></div></div>`).join('');
 return `<div class="card"><h2>Rapò vant</h2>${db.staff.length?`<select onchange="rs=this.value;render()"><option value="">Tout vandè</option>${db.staff.map(x=>`<option ${x.name===rs?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}<select onchange="per=this.value;render()">${[['day','Jodi a'],['week','7 dènye jou'],['month','Mwa sa a'],['all','Tout']].map(([k,v])=>`<option value="${k}" ${k===per?'selected':''}>${v}</option>`).join('')}</select><button class="btn" style="margin-top:8px" onclick="btPrintRep()">Imprime rapò a (Bluetooth)</button><div id="rpst" style="color:var(--mut);font-size:13px;margin-top:6px"></div></div>

 let L=db.sales.filter(s=>!s.void&&(!emp||s.seller===user.name)).sort((a,b)=>b.t-a.t);
 const k=wq.trim().toLowerCase();
 if(k)L=L.filter(s=>String(s.no)===k.replace('#','')||(s.client||'').toLowerCase().includes(k));
 return L.slice(0,10).map(s=>`<button class="prod" style="${s.no===waNo?'background:var(--bg);font-weight:700':''}" onclick="waPick(${s.no})"><span>Reçu #${s.no}${s.client?' · '+esc(s.client):''}<small style="display:block;color:var(--mut)">${dt(s.t)}${s.seller?' · '+esc(s.seller):''}</small></span><b>${money(s.total)}</b></button>`).join('')||'<div class="empty">Pa jwenn okenn fich.</div>'}
function waPrev(){const s=byNo(waNo);return s?`<h3 style="margin-top:10px">Mesaj la</h3><pre style="white-space:pre-wrap;font:13px/1.4 Figtree,system-ui,sans-serif;background:var(--bg);padding:10px;border-radius:10px;margin:0">${esc(rcText(s))}</pre>`:'<div class="empty">Chwazi yon fich pou w wè mesaj la.</div>'}
function waPick(n){waNo=n;const s=byNo(n);wph=(s&&s.phone)||'';$('wl').innerHTML=waList();$('wp').value=wph;$('wv').innerHTML=waPrev()}
function waOpen(){if(!curSale)return;waNo=curSale.no;wph=curSale.phone||'';closeRc();go('wa')}
function waSend(){const s=byNo(waNo);if(!s){alert('Chwazi yon fich anvan.');return}s.phone=wph.trim();save();wa(s,wph)}
function waCopy(){const s=byNo(waNo);if(!s){alert('Chwazi yon fich anvan.');return}try{navigator.clipboard.writeText(rcText(s)).then(()=>alert('Mesaj la kopye.')).catch(()=>alert('Pa ka kopye.'))}catch(e){alert('Pa ka kopye.')}}
function vWa(){return `<div class="card"><h2>WhatsApp</h2><label>Chèche fich (nimewo oswa kliyan)</label><input value="${esc(wq)}" placeholder="Nimewo oswa non kliyan" oninput="wq=this.value;$('wl').innerHTML=waList()"><div id="wl">${waList()}</div></div>
 <div class="card"><label>Nimewo WhatsApp kliyan</label><input id="wp" type="tel" inputmode="tel" placeholder="509 …" value="${esc(wph)}" oninput="wph=this.value"><div id="wv">${waPrev()}</div><button class="btn" style="background:#25d366;color:#0b3d1d;margin-top:10px" onclick="waSend()">Voye sou WhatsApp</button><button class="btn alt" style="margin-top:8px" onclick="waCopy()">Kopye mesaj la</button></div>`}

function trs(s,el){
 if(LG()!=='fr')return s;
 const t=String(s).trim();if(!t)return s;let o;
 if(t==='Anile')o=(el&&el.classList&&el.classList.contains('tag'))?'Annulé':'Annuler';else if(EX[t]!==undefined)o=EX[t];
 if(o!==undefined)return s.replace(t,o);
 s=String(s);for(const [a,b] of RG)s=s.replace(a,b);
 for(const [a,b] of PH)if(s.includes(a))s=s.split(a).join(b);
 return s}
const trNode=n=>{if(n.nodeType===3){const v=n.nodeValue,r=trs(v,n.parentElement);if(r!==v)n.nodeValue=r}else if(n.nodeType===1&&n.tagName!=='SCRIPT'&&n.tagName!=='STYLE'){if(n.hasAttribute('placeholder')){const v=n.getAttribute('placeholder'),r=trs(v);if(r!==v)n.setAttribute('placeholder',r)}n.childNodes.forEach(trNode)}};
