nav button.on{background:var(--pri);color:var(--onpri)}

<script>

const FB={apiKey:"AIzaSyApkB8LXYyrmZOQfy-jVI0AUb9Xy9swXiA",authDomain:"blanco-pos-system.firebaseapp.com",projectId:"blanco-pos-system",storageBucket:"blanco-pos-system.firebasestorage.app",messagingSenderId:"712229132301",appId:"1:712229132301:web:fad6a03549bae303705d44",measurementId:"G-PR3T62JJDY"};
const CFGD={name:'Blanco Multi_services',phone:'',address:'',footer:'Merci, revenez nous voir !',logo:'',paper:32};
let db={products:[],sales:[],staff:[],catalog:{},orders:[],clients:{},cfg:Object.assign({},CFGD)};
const save=()=>{};
const FBOK=!String(FB.apiKey).startsWith('COLLE')&&!!FB.projectId;
let fs=null,cfgLoaded=false,staffLoaded=false,autoDone=false,authErr='',busy=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(+n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' HTG';
const dt=t=>new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});

const TABS=[['vant','Vant'],['cmd','Kòmand'],['cli','Kliyan'],['pwodwi','Pwodwi'],['inv','Inventè'],['rap','Rapò'],['ist','Istorik'],['wa','WhatsApp'],['ctl','Kontwòl'],['admin','Admin']];

 const need=!user;if(need){hdr();$('nav').innerHTML='';$('app').style.zoom=1;$('app').innerHTML=vLogin();return}
 const T=user&&user!=='owner'?TABS.filter(t=>t[0]==='vant'||t[0]==='ist'||t[0]==='wa'):TABS;if(!T.some(t=>t[0]===tab))tab='vant';
 $('nav').innerHTML=T.map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}${k==='cmd'&&nNew()?' ('+nNew()+')':''}</button>`).join('');
 hdr();$('app').style.zoom=[.9,1,1.15,1.3][db.cfg.uiSize??1];$('app').innerHTML={vant:vVant,pwodwi:vProd,inv:vInv,rap:vRap,ist:vHist,wa:vWa,ctl:vCtl,cmd:vCmd,cli:vCli,admin:vAdmin}[tab]();if(tab==='admin')setTimeout(updOff,0);
}
const stTag=p=>p.svc?'<span class="tag ok">Sèvis</span>':p.qty<=0?'<span class="tag out">Fini</span>':p.qty<=(p.min??5)?`<span class="tag low">Ba · ${p.qty}</span>`:`<span class="tag ok">${p.qty}</span>`;
/* VANT */
function vVant(){
 const list=db.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
 const ids=Object.keys(cart);let tot=0;
 const lines=ids.map(id=>{const p=db.products.find(x=>x.id==id);if(!p)return'';tot+=p.price*cart[id];
  return `<div class="item"><div>${esc(p.name)}<small id="sl${id}">${money(p.price)} × ${cart[id]} = ${money(p.price*cart[id])}</small></div><div class="qty"><button onclick="chg(${id},-1)">−</button><input type="number" inputmode="numeric" min="1" ${p.svc?'':`max="${p.qty}"`} value="${cart[id]}" onfocus="this.select()" oninput="qtyInput(${id},this)" onchange="qtyDone(${id},this)" style="width:72px;text-align:center;margin:0;padding:7px"><button onclick="chg(${id},1)">+</button></div></div>`}).join('');
 return `${salesClosed()?'<div class="card" style="border-color:var(--bad);color:var(--bad);font-weight:700">'+closedMsg()+'</div>':''}<div class="card"><h2>Nouvo vant</h2><input id="q" placeholder="Chèche yon pwodwi…" value="${esc(q)}" oninput="q=this.value;keep()">
 <div id="pl">${plist(list)}</div></div>
 <div class="card"><h3>Panye</h3>${lines||'<div class="empty">Panye a vid. Tape sou yon pwodwi pou ajoute l.</div>'}
 <div class="total"><span>Total</span><span id="ct">${money(tot)}</span></div>
 <label>Non kliyan (opsyonèl)</label><input id="cn" list="cl-n" autocomplete="off" value="${esc(client)}" oninput="client=this.value;cliHint()" onchange="cliPick(this.value)">
 <label>Nimewo WhatsApp kliyan (opsyonèl)</label><input id="cp" list="cl-p" type="tel" inputmode="tel" placeholder="509 …" value="${esc(cphone)}" oninput="cphone=this.value;cliHint()" onchange="cliPick(this.value)"><datalist id="cl-n">${clOpts('n')}</datalist><datalist id="cl-p">${clOpts('p')}</datalist><div id="cih" style="font-size:13px;color:var(--mut);margin:-2px 0 8px">${cliHintText()}</div>
 ${user&&user!=='owner'?`<p style="margin:0 0 8px;color:var(--mut)">Vandè: <b style="color:var(--ink)">${esc(user.name)}</b></p>`:''}${db.staff.length&&user==='owner'?`<label>Vandè</label><select onchange="seller=this.value"><option value="">—</option>${db.staff.map(x=>`<option ${x.name===seller?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}<label>Peman</label><select onchange="pay=this.value;render()">${['Kach','MonCash','Natcash','Kredi'].map(x=>`<option value="${x}" ${x===pay?'selected':''}>${x}</option>`).join('')}</select>
 ${calcHtml(ids.length)}<button class="btn" onclick="sell()" ${ids.length?'':'disabled style="opacity:.5"'}>Konfime vant</button></div>`}
const plist=l=>l.length?l.map(p=>`<button class="prod" ${!p.svc&&p.qty<=0?'disabled':''} onclick="add(${p.id})"><span>${esc(p.name)}<small style="display:block;color:var(--mut)">${money(p.price)}</small></span>${stTag(p)}</button>`).join(''):'<div class="empty">Pa gen pwodwi. Ale nan "Pwodwi" pou ajoute yo.</div>';
function keep(){$('pl').innerHTML=plist(db.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())))}
function add(id){if(salesClosed()){alert(closedMsg());return}const p=db.products.find(x=>x.id==id);if(p.svc||(cart[id]||0)<p.qty)cart[id]=(cart[id]||0)+1;else alert('Pa gen plis stòk pou '+p.name);render()}
function qtyInput(id,el){
 const p=db.products.find(x=>x.id==id);if(!p)return;
 let n=parseInt(el.value);if(isNaN(n)||n<1)return;
 if(!p.svc&&n>p.qty){n=p.qty;el.value=n;alert('Pa gen plis stòk pou '+p.name)}
 cart[id]=n;updCart(id,p)}
function qtyDone(id,el){const n=parseInt(el.value);if(isNaN(n)||n<1){delete cart[id];render()}else el.value=cart[id]}
function updCart(id,p){
 const s=document.getElementById('sl'+id);if(s)s.textContent=money(p.price)+' × '+cart[id]+' = '+money(p.price*cart[id]);
 let t=0;Object.keys(cart).forEach(k=>{const q=db.products.find(x=>x.id==k);if(q)t+=q.price*cart[k]});
 const e=document.getElementById('ct');if(e)e.textContent=money(t);const gc=document.getElementById('gc');if(gc)gc.innerHTML=changeHtml(t)}
let given='';
const curTot=()=>{let t=0;Object.keys(cart).forEach(k=>{const q=db.products.find(x=>x.id==k);if(q)t+=q.price*cart[k]});return t};
function changeHtml(tt){const g=parseFloat(given);if(given===''||isNaN(g))return '';const d=g-tt;return d>=0?'<span class="ok">Balans pou remèt: '+money(d)+'</span>':'<span style="color:var(--bad)">Manke: '+money(-d)+'</span>'}
function setGiven(v,btn){given=String(v);if(btn){const e=document.getElementById('gv');if(e)e.value=given}const c=document.getElementById('gc');if(c)c.innerHTML=changeHtml(curTot())}
function calcHtml(n){return pay==='Kach'&&n?`<div style="margin:8px 0 10px;padding:10px;border:1px dashed var(--line);border-radius:10px"><label style="margin-top:0">Kliyan bay (HTG)</label><input id="gv" type="number" inputmode="decimal" min="0" value="${esc(given)}" oninput="setGiven(this.value)" placeholder="0"><div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:6px">${[50,100,250,500,1000].map(v=>`<button class="btn sm alt" style="flex:0 0 auto" onclick="setGiven(${v},1)">${v}</button>`).join('')}<button class="btn sm alt" style="flex:0 0 auto" onclick="setGiven(curTot(),1)">Egzak</button></div><div id="gc" style="font-weight:800;font-size:18px">${changeHtml(curTot())}</div></div>`:''}
function chg(id,d){const p=db.products.find(x=>x.id==id);const n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(p.svc||n<=p.qty)cart[id]=n;render()}
function nextNo(){
 const key='blanco_n_'+(user==='owner'?'P':user.id);let c=0;
 try{c=+localStorage.getItem(key)||0}catch(e){}
 if(user!=='owner')c=Math.max(c,user.n||0);else db.sales.forEach(x=>{const m=/^P-(\d+)$/.exec(String(x.no));if(m)c=Math.max(c,+m[1])});
 c++;try{localStorage.setItem(key,c)}catch(e){}
 return c}
const snOf=x=>x.sn||(db.staff.slice().sort((a,b)=>a.id-b.id).findIndex(s=>s.id===x.id)+1);
function sell(){
 if(salesClosed()){alert(closedMsg());return}
 if(busy)return;
 const items=Object.keys(cart).map(id=>{const p=db.products.find(x=>x.id==id);return{id:p.id,name:p.name,price:p.price,cost:p.cost||0,qty:cart[id],svc:!!p.svc}});
 if(!items.length)return;
 const bad=items.find(i=>{const q=db.products.find(x=>x.id===i.id);return !q.svc&&q.qty<i.qty});
 if(bad){alert('Pa gen ase stòk pou '+bad.name);return}
 busy=true;
 const c=nextNo(),no=(user==='owner'?'P':'V'+snOf(user))+'-'+String(c).padStart(4,'0');
 const sale={no,t:Date.now(),client:client.trim(),phone:cphone.trim(),seller:(user&&user!=='owner')?user.name:seller,pay,items,total:items.reduce((a,i)=>a+i.price*i.qty,0)};
 const g=parseFloat(given)||0;if(pay==='Kach'&&g>0&&g>=sale.total){sale.paid=g;sale.change=g-sale.total}
 const inc=firebase.firestore.FieldValue.increment,b=fs.batch();
 items.forEach(i=>{if(!i.svc)b.set(fs.doc('products/'+i.id),{qty:inc(-i.qty)},{merge:true})});
 const ck=cliKey(client,cphone);if(ck)sale.ckey=ck;
 b.set(fs.doc('sales/'+no),{...sale,ts:firebase.firestore.FieldValue.serverTimestamp()});
 if(ck){const cd={last:Date.now(),n:inc(1),spent:inc(sale.total)};if(client.trim())cd.name=client.trim();if(digits(cphone))cd.phone=cphone.trim();b.set(fs.doc('clients/'+ck),cd,{merge:true})}
 if(user!=='owner')b.set(fs.doc('staff/'+user.id),{n:c},{merge:true});
 b.commit().catch(e=>alert(e.message));
 sheetPush({type:'sale',no,t:sale.t,client:sale.client,seller:sale.seller,pay,total:sale.total,items:items.map(i=>({name:i.name,qty:i.qty}))});
 cart={};client='';cphone='';given='';busy=false;render();showRc(sale)}
/* PWODWI */
function vProd(){
 const e=db.products.find(p=>p.id===editId)||{};
 const rows=db.products.map(p=>`<div class="item"><div>${esc(p.name)}<small>Vant ${money(p.price)}${p.cost?' · Acha '+money(p.cost):''} · ${p.svc?'Sèvis':'Stòk '+p.qty}${db.catalog[p.id]?' · Sou sit la':''}</small></div><div class="row fit"><button class="btn sm alt" onclick="edit(${p.id})">Modifye</button>${delId===p.id?`<button class="btn sm bad" onclick="del(${p.id})">Konfime?</button>`:`<button class="btn sm alt" onclick="delId=${p.id};render()">Efase</button>`}</div></div>`).join('');
 return `<div class="card"><h2>${editId?'Modifye pwodwi':'Ajoute pwodwi'}</h2>
 <label>Non pwodwi</label><input id="pn" value="${esc(e.name||'')}">
 <div class="row"><div><label>Pri vant (HTG)</label><input id="pp" type="number" inputmode="decimal" min="0" value="${e.price??''}"></div><div><label>Pri acha (opsyonèl)</label><input id="pc" type="number" inputmode="decimal" min="0" value="${e.cost||''}"></div></div>
 <div class="row"><div><label>Kantite disponib</label><input id="pq" type="number" inputmode="numeric" min="0" value="${e.qty??''}"></div><div><label>Alèt stòk ba (≤)</label><input id="pm" type="number" inputmode="numeric" min="0" value="${e.min??5}"></div></div>
 <label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin:4px 0 10px"><input id="ps" type="checkbox" style="width:auto;margin:0" ${e.svc?'checked':''}>Sèvis (pa gen stòk)</label>
 <div class="row"><button class="btn" onclick="saveP()">${editId?'Anrejistre chanjman':'Ajoute'}</button>${editId?'<button class="btn alt fit" onclick="editId=null;render()">Anile</button>':''}</div></div>
 <div class="card"><h3>Lis pwodwi (${db.products.length})</h3>${rows||'<div class="empty">Pa gen pwodwi ankò.</div>'}</div>`}
function edit(id){editId=id;render();scrollTo(0,0)}
async function del(id){try{const b=fs.batch();b.delete(fs.doc('products/'+id));b.delete(fs.doc('catalog/'+id));await b.commit()}catch(e){alert(e.message);return}delete cart[id];delId=null;render()}
async function saveP(){
 const name=$('pn').value.trim(),price=parseFloat($('pp').value),svc=$('ps').checked;let qty=parseInt($('pq').value);if(svc&&isNaN(qty))qty=0;
 if(!name||isNaN(price)||isNaN(qty)){alert('Ranpli non, pri vant ak kantite.');return}
 const id=editId||Date.now(),o={name,price,cost:parseFloat($('pc').value)||0,qty,min:parseInt($('pm').value)||0,svc};
 try{const b=fs.batch();b.set(fs.doc('products/'+id),o);if(db.catalog[id])b.set(fs.doc('catalog/'+id),{name,price,svc},{merge:true});await b.commit()}catch(e){alert(e.message);return}
 editId=null;render()}
/* INVENTE */
function vInv(){
 const val=db.products.reduce((a,p)=>a+(p.svc?0:p.qty*p.price),0),low=db.products.filter(p=>!p.svc&&p.qty<=(p.min??5)).length;
 const rows=db.products.map(p=>`<div class="item"><div>${esc(p.name)}<small>${money(p.price)}${p.svc?'':' · Valè stòk '+money(p.qty*p.price)}</small></div><div class="row fit">${stTag(p)}${p.svc?'':`<input id="r${p.id}" type="number" inputmode="numeric" min="1" placeholder="+" style="width:64px;margin:0"><button class="btn sm" onclick="restock(${p.id})">Ajoute</button>`}</div></div>`).join('');
 return `<div class="stats"><div class="stat"><small>Valè total stòk</small><b>${money(val)}</b></div><div class="stat"><small>Pwodwi ki ba / fini</small><b>${low}</b></div></div>
 <div class="card"><h2>Inventè (${db.products.length} pwodwi)</h2>${rows||'<div class="empty">Pa gen pwodwi ankò.</div>'}</div>`}
async function restock(id){const n=parseInt($('r'+id).value);if(!n||n<1)return;try{await fs.doc('products/'+id).update({qty:firebase.firestore.FieldValue.increment(n)})}catch(e){alert(e.message);return}render()}
/* RAPO */
function vRap(){
 const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
 const from={day:d0,week:d0-6*864e5,month:new Date(now.getFullYear(),now.getMonth(),1).getTime(),all:0}[per];
 const SA=db.sales.filter(s=>s.t>=from&&(!rs||s.seller===rs)).sort((a,b)=>b.t-a.t),S=SA.filter(s=>!s.void);
 const tot=S.reduce((a,s)=>a+s.total,0),n=S.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty,0),0);

function ordWa(code){
 const o=db.orders.find(x=>x.code===code);if(!o)return;
 let ph=(o.phone||'').replace(/\D/g,'');if(ph.length===8)ph='509'+ph;
 const fr=(o.lang||LG())==='fr',S={fr:{nouvo:'bien reçue',konfime:'confirmée',pare:'prête',livre:'livrée',kansele:'annulée'},ht:{nouvo:'resevwa',konfime:'konfime',pare:'pare',livre:'livre',kansele:'kanselè'}}[fr?'fr':'ht'][o.status]||'';
 const m=fr?'Bonjour '+o.name+', ici '+db.cfg.name+'. Votre commande '+o.code+' ('+money(o.total)+') est '+S+'. Merci !':'Bonjou '+o.name+', se '+db.cfg.name+'. Kòmand ou '+o.code+' ('+money(o.total)+') '+S+'. Mèsi!';
 window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(m),'_blank')}
function ordToCart(code){
 const o=db.orders.find(x=>x.code===code);if(!o)return;cart={};let miss=0;
 o.items.forEach(i=>{const p=db.products.find(x=>x.id===+i.id);if(p)cart[p.id]=p.svc?i.qty:Math.min(i.qty,p.qty);else miss++});
 client=o.name;cphone=o.phone;pay=['Kach','MonCash','Natcash'].includes(o.pay)?o.pay:'Kach';go('vant');
 if(miss)alert('Gen pwodwi ki pa jwenn nan lis la: '+miss)}
function shrinkUrl(u,max){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'))};im.onerror=()=>res('');im.src=u})}
/* ===== KLIYAN ===== */
let cliQ='',cliEd=null,cliOpen='',cliDel='';
const digits=s=>String(s||'').replace(/\D/g,'');
const normPh=p=>{let d=digits(p);if(d.length===8)d='509'+d;return d};
const cliKey=(n,p)=>{const d=normPh(p);if(d.length>=8)return d;const s=String(n||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);return s?'n_'+s:''};
function cliFind(v){v=String(v||'').trim();if(!v)return null;const d=normPh(v),l=v.toLowerCase();return Object.values(db.clients).find(c=>(d.length>=8&&(c.key===d||normPh(c.phone)===d))||(c.name||'').toLowerCase()===l)||null}
const clOpts=m=>Object.values(db.clients).filter(c=>m==='n'?c.name:c.phone).map(c=>m==='n'?`<option value="${esc(c.name)}">${esc(c.phone||'')}</option>`:`<option value="${esc(c.phone)}">${esc(c.name||'')}</option>`).join('');
function cliHintText(){const c=cliFind(cphone)||cliFind(client);if(c)return 'Kliyan konnen: '+(c.n||0)+' acha · '+money(c.spent||0)+(c.last?' · '+dt(c.last):'');return (client.trim()||digits(cphone))?'Nouvo kliyan: li ap anrejistre apre vant lan.':''}
function cliHint(){const e=document.getElementById('cih');if(e)e.textContent=cliHintText()}
function cliPick(v){const c=cliFind(v);if(c){client=c.name||'';cphone=c.phone||'';const a=document.getElementById('cn'),b=document.getElementById('cp');if(a)a.value=client;if(b)b.value=cphone}cliHint()}
function cliHistHtml(c){const S=db.sales.filter(s=>!s.void&&(s.ckey===c.key||(c.phone&&normPh(s.phone)===normPh(c.phone)))).sort((a,b)=>b.t-a.t).slice(0,10);
 return '<div style="margin-top:8px;border-top:1px dashed var(--line);padding-top:6px">'+(S.map(s=>`<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>${dt(s.t)} · ${esc(s.items.map(i=>i.name+(i.qty>1?' ×'+i.qty:'')).join(', ').slice(0,60))}</span><b>${money(s.total)}</b></div>`).join('')||'<small style="color:var(--mut)">Pa gen acha anrejistre.</small>')+'</div>'}
function cliListHtml(){
 const k=cliQ.trim().toLowerCase(),dk=digits(cliQ);
 const L=Object.values(db.clients).filter(c=>!k||(c.name||'').toLowerCase().includes(k)||(dk&&digits(c.phone).includes(dk))).sort((a,b)=>(b.last||0)-(a.last||0)).slice(0,100);
 return L.map(c=>`<div class="card"><div class="row"><div><b>${esc(c.name||c.phone)}</b><small style="display:block;color:var(--mut)">${esc(c.phone||'')}${c.note?' · '+esc(c.note):''}</small></div><div class="fit" style="text-align:right"><b>${money(c.spent||0)}</b><small style="display:block;color:var(--mut)">${c.n||0} acha</small></div></div><small style="display:block;color:var(--mut);margin-top:4px">Dènye acha: ${c.last?dt(c.last):'—'}</small>
 <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">${c.phone?`<button class="btn sm" style="background:#25d366;color:#0b3d1d;flex:0 0 auto" onclick="cliWa('${c.key}')">WhatsApp</button>`:''}<button class="btn sm" style="flex:0 0 auto" onclick="cliSell('${c.key}')">Nouvo vant</button><button class="btn sm alt" style="flex:0 0 auto" onclick="cliOpen=cliOpen==='${c.key}'?'':'${c.key}';render()">Istwa</button><button class="btn sm alt" style="flex:0 0 auto" onclick="cliEdit('${c.key}')">Modifye</button>${cliDel===c.key?`<button class="btn sm bad" style="flex:0 0 auto" onclick="cliDelete('${c.key}')">Konfime?</button>`:`<button class="btn sm alt" style="flex:0 0 auto" onclick="cliDel='${c.key}';render()">Efase</button>`}</div>${cliOpen===c.key?cliHistHtml(c):''}</div>`).join('')||'<div class="card"><div class="empty">Pa gen kliyan ankò.</div></div>'}
function vCli(){
 const f=cliEd;
 const form=f?`<div class="card"><h3>${f.key?'Modifye kliyan':'Nouvo kliyan'}</h3><label>Non</label><input id="kn" value="${esc(f.name)}"><label>Telefòn</label><input id="kp" type="tel" inputmode="tel" value="${esc(f.phone)}"><label>Nòt</label><input id="kt" value="${esc(f.note||'')}"><div class="row"><button class="btn" onclick="cliSave()">Anrejistre</button><button class="btn alt" onclick="cliEd=null;render()">Anile</button></div></div>`:`<button class="btn" style="margin-bottom:12px" onclick="cliEd={key:'',name:'',phone:'',note:''};render()">+ Nouvo kliyan</button>`;
 return `<div class="card"><h2>Kliyan (${Object.keys(db.clients).length})</h2><input id="kq" placeholder="Chèche kliyan (non oswa telefòn)" value="${esc(cliQ)}" oninput="cliQ=this.value;document.getElementById('kl').innerHTML=cliListHtml()"></div>${form}<div id="kl">${cliListHtml()}</div>`}
function cliEdit(k){const c=db.clients[k];if(c){cliEd={key:k,name:c.name||'',phone:c.phone||'',note:c.note||''};render()}}
function cliSell(k){const c=db.clients[k];if(!c)return;client=c.name||'';cphone=c.phone||'';go('vant')}
function cliWa(k){const c=db.clients[k];if(!c||!c.phone)return;const fr=LG()==='fr',m=fr?'Bonjour '+(c.name||'')+', ici '+db.cfg.name+'. Merci pour votre confiance !':'Bonjou '+(c.name||'')+', se '+db.cfg.name+'. Mèsi pou konfyans ou!';window.open('https://wa.me/'+normPh(c.phone)+'?text='+encodeURIComponent(m),'_blank')}
async function cliSave(){const f=cliEd,name=$('kn').value.trim(),phone=$('kp').value.trim(),note=$('kt').value.trim();
 if(!name&&!digits(phone)){alert('Mete yon non oswa yon telefòn.');return}
 const nk=cliKey(name,phone),old=f.key?db.clients[f.key]:null,b=fs.batch(),d={name,phone,note};
 if(old&&f.key!==nk){b.set(fs.doc('clients/'+nk),{...d,n:old.n||0,spent:old.spent||0,last:old.last||0});b.delete(fs.doc('clients/'+f.key))}
 else b.set(fs.doc('clients/'+(f.key||nk)),d,{merge:true});
 try{await b.commit()}catch(e){alert(e.message);return}cliEd=null;render()}
async function cliDelete(k){try{await fs.doc('clients/'+k).delete()}catch(e){alert(e.message);return}cliDel='';render()}
let unsubCl=null;
function startClients(){unsubCl=fs.collection('clients').onSnapshot(sn=>{db.clients={};sn.docs.forEach(d=>{db.clients[d.id]={...d.data(),key:d.id}});soft()},()=>{})}
function cloudInit(){
 if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').then(()=>updOff()).catch(e=>{swErr=e.message;updOff()});navigator.serviceWorker.addEventListener('controllerchange',updOff);navigator.serviceWorker.ready.then(updOff).catch(()=>{})}
 if(!FBOK)return;
 try{firebase.initializeApp(FB);fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().onAuthStateChanged(u=>{authReady=true;authUser=u||null;if(u)afterAuth(u);else{resetSession();render()}});
 }catch(e){authErr=e.message;render()}}
cloudInit();render();
</script>
